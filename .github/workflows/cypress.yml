name: Cypress UATs

on:
  push:
    branches: [lesson-6]
  pull_request:
    branches: [lesson-6]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Serve built app
        run: |
          npx serve -s build -l 4173 &
          echo "Waiting for local app to start..."
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:4173 >/dev/null 2>&1; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for app" && exit 1

      - name: Run Cypress tests
        run: npx cypress run
